[package]
name = "hdmeal-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "HDMeal backend (Rust + Warp) — NEIS 급식/시간표/일정, KMA 날씨, 한강 수온, 카카오 챗봇, MongoDB"
license = "MIT"

[lib]
name = "hdmeal_backend"
path = "src/lib.rs"

[[bin]]
name = "hdmeal-backend"
path = "src/main.rs"

[dependencies]
warp = { version = "0.4", default-features = false, features = ["server", "test"] }
tokio = { version = "1", features = ["full"] }
mongodb = { version = "3.7", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver"] }
bson = { version = "3.1", features = ["chrono-0_4", "uuid-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "v4", "serde"] }
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = { version = "0.33", default-features = false }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
dotenvy = "0.15"
bs58 = "0.5"
regex = "1"
rand = "0.10"
parking_lot = "0.12"
futures = "0.3"
url = "2"
subtle = "2"
percent-encoding = "2"

# 테스트 / 벤치 / 예제 빌드 시에만 활성화되는 추가 feature.
# release 빌드에는 포함되지 않으므로, 런타임 바이너리 크기에 영향 없음.
[dev-dependencies]
warp = { version = "0.4", features = ["server", "test"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util", "test-util"] }

[lints.rust]
unsafe_code = "forbid"

# ----- Release profile (size + perf 극한) -----
# - `lto = "fat"`: whole-program LTO 로 dead code / 중복 모노모피즈이션 적극 제거 → 가장 작은 바이너리.
# - `panic = "abort"`: unwinding tables / landing pads 제거 → 크기 ↓, 약간의 perf ↑ (panic 은 그대로 발생).
# - `codegen-units = 1`: inlining / 최적화 cross-module 활성화 (fat LTO 와 시너지).
# - `opt-level = 3`: full optimization.
# - `strip = "symbols"`: 최종 바이너리에서 symbol table 제거. panic 의 file:line 은 .symtab 제거로 사라지지만,
#   prod 서버에서는 무시할 수 있는 trade-off. 더 줄이려면 `strip = true` (Rust 1.59+).
# - `incremental = false`: release 에서 incremental compilation 비활성 (이미 기본이지만 명시).
# - `build-override`: build.rs (proc-macro 등) 도 release 레벨로 컴파일.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
debug = false

[profile.release.build-override]
opt-level = 3
codegen-units = 1

# 모든 의존성 패키지에 release 레벨 최적화 강제.
[profile.release.package."*"]
opt-level = 3
