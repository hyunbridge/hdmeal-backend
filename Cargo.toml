[package]
name = "hdmeal-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "HDMeal backend (Rust + Warp) — NEIS 급식/시간표/일정, KMA 날씨, 한강 수온, 카카오 챗봇, MongoDB"
license = "MIT"

[lib]
name = "hdmeal_backend"
path = "src/lib.rs"

[[bin]]
name = "hdmeal-backend"
path = "src/main.rs"

[dependencies]
warp = "0.3"
tokio = { version = "1", features = ["full"] }
mongodb = "3"
bson = { version = "2", features = ["chrono-0_4", "uuid-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "v4", "serde"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.28"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "trace"] }
opentelemetry-semantic-conventions = "0.27"
dotenvy = "0.15"
bs58 = "0.5"
regex = "1"
rand = "0.8"
parking_lot = "0.12"
futures = "0.3"
url = "2"
subtle = "2"
percent-encoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util", "macros"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
