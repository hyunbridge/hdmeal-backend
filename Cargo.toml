[package]
name = "hdmeal-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "HDMeal backend (Rust + Warp) — NEIS 급식/시간표/일정, KMA 날씨, 한강 수온, 카카오 챗봇, MongoDB"
license = "MIT"

[lib]
name = "hdmeal_backend"
path = "src/lib.rs"

[[bin]]
name = "hdmeal-backend"
path = "src/main.rs"

[dependencies]
# Warp: "test" feature (warp::test 등) 는 dev-deps 로 이동시켜 release 바이너리에서 제외.
warp = { version = "0.4", default-features = false, features = ["server"] }
# Tokio: "full" 대신 실제 사용 feature 만 (rt-multi-thread, net, time, sync, signal, macros, io-util).
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "signal",
    "sync",
    "io-util",
] }
mongodb = { version = "3.7", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver"] }
bson = { version = "3.1", features = ["chrono-0_4", "uuid-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "v4", "serde"] }
# HS256 만 사용하므로 aws_lc_rs 대신 pure-Rust crypto (hmac+sha2) 사용.
# jsonwebtoken 10.x 는 ring feature 가 없고, 동등한 의도의 feature 가 `rust_crypto`
# (RustCrypto 의 hmac + sha2). aws_lc_rs 를 통째로 빼면 ~1.5MB + C 빌드 의존성 절감.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
# reqwest: `rustls-no-provider` (NOT `rustls`) — `rustls` feature 가 `__rustls-aws-lc-rs` 를
# 강제 활성화시켜 rustls-webpki/rustls/tokio-rustls/hyper-rustls 전부에 `aws-lc-rs` C 라이브러리
# (~1.5MB) 가 들어가게 만든다. `rustls-no-provider` 는 명시적 provider 미설치 상태로 빌드되므로
# `rustls/ring` (mongodb 의 `rustls-tls` 가 활성화) 만 남고 aws-lc-rs / aws-lc-sys 가 완전히 빠진다.
# 단, reqwest::Client::new() / ClientBuilder::build() 호출 전에 `install_default()` 필요
# (app::run() 최상단 + HttpClient::new() 두 곳에서 안전하게 호출, idempotent).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "gzip"] }
# rustls: 직접 dep — `rustls::crypto::ring::default_provider().install_default()` 호출에 필요.
# `default-features = false` + `ring` 만 활성화하여 aws-lc-rs / aws-lc-sys 가 들어오지 않도록.
# mongodb 가 `logging` 을 활성화하므로 cargo feature unification 으로 최종적으로 std/tls12/logging/ring 가 활성.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
# tracing-subscriber: "json" formatter + "tracing-log" (log crate 미사용) + "ansi" (prod 불필요) 제외.
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
tracing-opentelemetry = { version = "0.33", default-features = false }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
dotenvy = "0.15"
bs58 = "0.5"
# regex: 패턴이 모두 ASCII-only 이지만 `\d` 가 unicode-perl 클래스에 의존.
# unicode-age / unicode-script / unicode-segment / unicode-bool / unicode-case / unicode-gencat
# (CJK / 이모지 / 케이스 폴딩 테이블) 는 제외 → 수백 KB 절감.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
# rand: 전체 크레이트 대신 rand_core + rand_chacha 만 사용.
rand_core = "0.6"
rand_chacha = "0.3"
# futures: TryStreamExt 만 사용 → futures-util 로 교체.
# futures 크레이트는 re-export 레이어일 뿐이지만, 빌드 시간과
# resolve 오버헤드가 있으므로 직접 의존이 더 깔끔.
futures-util = "0.3"
futures-executor = "0.3"
url = "2"
subtle = "2"

# 테스트 / 벤치 / 예제 빌드 시에만 활성화되는 추가 feature.
# release 빌드에는 포함되지 않으므로, 런타임 바이너리 크기에 영향 없음.
[dev-dependencies]
warp = { version = "0.4", features = ["server", "test"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util", "test-util"] }

[lints.rust]
unsafe_code = "forbid"

# ----- Release profile (size-focused, measured knobs only) -----
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
