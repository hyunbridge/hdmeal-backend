[package]
name = "hdmeal-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "HDMeal backend (Rust + Axum) — NEIS 급식/시간표/일정, KMA 날씨, 한강 수온, 카카오 챗봇, MongoDB"
license = "MIT"

[lib]
name = "hdmeal_backend"
path = "src/lib.rs"

[[bin]]
name = "hdmeal-backend"
path = "src/main.rs"

[dependencies]
# Axum: 미사용 feature (`form`, `tower-log` 등) 제외. `matched-path`/`original-uri` 는
# `MatchedPath`/`OriginalUri` extractor (path 정규화 metrics + OTel span attribute) 용.
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
    "tracing",
    "matched-path",
    "original-uri",
] }
# tower: ServiceExt::oneshot (테스트) + util::BoxCloneService 등 최소 feature.
tower = { version = "0.5", default-features = false, features = ["util"] }
# tower-http: CorsLayer, RequestBodyLimitLayer, SetResponseHeaderLayer 만 활성화.
# `default-features = false` 로 compression/trace(완전형) / fs 등 미사용 모듈 차단.
tower-http = { version = "0.6", default-features = false, features = [
    "cors",
    "limit",
    "set-header",
] }
# Tokio: "full" 대신 실제 사용 feature 만 (rt-multi-thread, net, time, sync, signal, macros).
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "signal",
    "sync",
] }
mongodb = { version = "3.7", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver"] }
bson = { version = "3.1", features = ["chrono-0_4", "uuid-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "v4", "serde"] }
# HS256 만 사용한다. jsonwebtoken 은 클레임 파싱/검증만 맡기고,
# 서명/검증은 ring 기반 HMAC-SHA256 provider 로 처리해 RSA/ECDSA 의존성을 제외한다.
jsonwebtoken = { version = "10", default-features = false }
ring = "0.17"
# reqwest: `rustls-no-provider` (NOT `rustls`) — `rustls` feature 가 `__rustls-aws-lc-rs` 를
# 강제 활성화시켜 rustls-webpki/rustls/tokio-rustls/hyper-rustls 전부에 `aws-lc-rs` C 라이브러리
# (~1.5MB) 가 들어가게 만든다. `rustls-no-provider` 는 명시적 provider 미설치 상태로 빌드되므로
# `rustls/ring` (mongodb 의 `rustls-tls` 가 활성화) 만 남고 aws-lc-rs / aws-lc-sys 가 완전히 빠진다.
# 단, reqwest::Client::new() / ClientBuilder::build() 호출 전에 `install_default()` 필요
# (app::run() 최상단 + HttpClient::new() 두 곳에서 안전하게 호출, idempotent).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "gzip"] }
# rustls: 직접 dep — `rustls::crypto::ring::default_provider().install_default()` 호출에 필요.
# `default-features = false` + `ring` 만 활성화하여 aws-lc-rs / aws-lc-sys 가 들어오지 않도록.
# mongodb 가 `logging` 을 활성화하므로 cargo feature unification 으로 최종적으로 std/tls12/logging/ring 가 활성.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
# tracing-subscriber: "json" formatter + "tracing-log" (log crate 미사용) + "ansi" (prod 불필요) 제외.
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
tracing-opentelemetry = { version = "0.33", default-features = false }
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
dotenvy = "0.15"
dashmap = "6"
# regex: 패턴이 모두 ASCII-only 이지만 `\d` 가 unicode-perl 클래스에 의존.
# unicode-age / unicode-script / unicode-segment / unicode-bool / unicode-case / unicode-gencat
# (CJK / 이모지 / 케이스 폴딩 테이블) 는 제외 → 수백 KB 절감.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
# rand: retry jitter 용 thread-local RNG 만 사용.
rand = "0.10"
# futures: TryStreamExt 만 사용 → futures-util 로 교체.
# futures 크레이트는 re-export 레이어일 뿐이지만, 빌드 시간과
# resolve 오버헤드가 있으므로 직접 의존이 더 깔끔.
futures-util = "0.3"
url = "2"
subtle = "2"
# 인증 토큰을 고정 길이 digest 로 만든 뒤 상수 시간 비교에 사용.
sha2 = "0.11"

# 테스트 / 벤치 / 예제 빌드 시에만 활성화되는 추가 feature.
# release 빌드에는 포함되지 않으므로, 런타임 바이너리 크기에 영향 없음.
[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "test-util"] }

[lints.rust]
unsafe_code = "forbid"

# ----- Release profile -----
# 8-프로파일 벤치마크 (scripts/bench_profiles.sh, target/bench-results/) 의
# 파레토 분석 결과. 사용자 우선순위: perf > size > build.
#
# 측정 결과 요약 (macOS arm64, 8 core, Apple M1 기준):
#   profile | opt | lto  | cgu | main KiB | cold s | JWT ns
#   A1      | 3   | fat  | 1   |  9,179   |  289   | 5,138
#   A3*     | 3   | thin | 1   | 10,170   |  182   | 4,805   ← 채택
#   A4      | 3   | thin | 16  | 11,999   |  125   | 4,887
#   C1      | 3   | false| 256 | 12,088   |  123   | 5,102
#   B2      | s   | fat  | 1   |  6,842   |  129   | 6,200
#   B1      | z   | fat  | 1   |  5,265   |  127   | 8,818   (이전 설정)
#
# 결과:
#   - A3 (lto=thin) 가 A1 (lto=fat) 대비 JWT 등 hot-path 4/6 지표에서 우위.
#     fat 의 cross-crate inlining 이 이 코드베이스에서는 이득이 없거나
#     icache 비용으로 이어짐. thin 이 cross-module inline 은 유지하면서
#     link 시간은 37% 단축.
#   - opt=z (B1) 는 같은 hot-path 에서 1.84× 느려짐. 사이즈 5.3MB vs 10.2MB.
#     사용자 우선순위 (perf 우선) 에 따라 opt=3 채택.
#   - cgu=1 유지: A4 (cgu=16) 와 비교해 JWT 2% 더 빠르고 빌드는 60s 더.
#   - overflow-checks=false: src/ 어디에도 wrapping_* 의존 없음. release 빌드
#     산술 overhead 제거.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

# bench/criterion 사용 시 release 와 동일 flag 적용
[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
